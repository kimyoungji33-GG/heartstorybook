<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><script>if(new URLSearchParams(location.search).has('book')||['#children','#adults','#tales'].includes(location.hash)){location.replace('previous-home.html'+location.search+location.hash)}</script><meta name="viewport" content="width=device-width, initial-scale=1"><title>마음동화책방</title>
<style>
:root{--cream:#fff6e6;--honey:#e8a64a;--brown:#4a3322}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--cream);background:#2b1d14;overflow:hidden}.scene{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(43,29,20,.55),rgba(43,29,20,.2) 40%,rgba(43,29,20,.65)),url("livingroom/room/images/room_a_chair_03.webp") center/cover no-repeat,linear-gradient(#f3c98b,#c9863f);filter:blur(3px) saturate(1.05);transform:scale(1.06);animation:breathe 18s ease-in-out infinite alternate}.glow{position:fixed;left:50%;top:38%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,200,120,.35),rgba(255,200,120,0) 65%);animation:pulse 7s ease-in-out infinite;pointer-events:none}@keyframes breathe{from{transform:scale(1.06)}to{transform:scale(1.1)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.95}}.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px;opacity:0;animation:rise 1.4s .3s ease forwards}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}h1{font-size:clamp(34px,7vw,64px);font-weight:700;letter-spacing:.02em;text-shadow:0 2px 14px rgba(40,25,12,.6)}.sub{font-size:clamp(15px,2.4vw,20px);opacity:.92;text-shadow:0 1px 8px rgba(40,25,12,.6)}.choices{margin-top:22px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.btn{min-width:190px;min-height:52px;padding:14px 26px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1.5px solid rgba(255,246,230,.7);color:var(--cream);text-decoration:none;font-size:18px;background:rgba(74,51,34,.35);backdrop-filter:blur(4px);transition:background .3s,transform .3s}.btn:disabled{font-family:inherit;opacity:.7;cursor:default}.btn:not(:disabled):hover,.btn:focus-visible{background:rgba(255,246,230,.2);transform:translateY(-2px);outline:none}.btn.primary{background:rgba(232,166,74,.92);color:#3b2614;border-color:transparent;font-weight:700}.btn.primary:hover,.btn.primary:focus-visible{background:#f2b862}.fade{position:fixed;inset:0;background:#2b1d14;opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:5}.fade.on{opacity:1;pointer-events:auto}@media(prefers-reduced-motion:reduce){.scene,.glow{animation:none}.wrap{animation:none;opacity:1}.fade{transition:none}}
.entrance-language{position:absolute;z-index:3;top:16px;right:16px;display:flex;align-items:center;gap:8px;padding:6px 9px 6px 13px;border:1px solid rgba(255,246,230,.7);border-radius:24px;background:#4a3322;color:var(--cream)}
.entrance-language select{padding:4px 7px;min-height:32px;border:0;border-radius:14px;background:#fff6e6;color:#4a3322;font:inherit}
.wrap{padding-top:72px}
@media(max-height:500px){body{overflow:auto}.wrap{height:auto;min-height:100%}}
</style></head><body><div class="scene"></div><div class="glow"></div>
<label class="entrance-language"><span id="language-label">언어</span>
  <select id="entrance-language">
    <option value="ko" lang="ko">한국어</option>
    <option value="en" lang="en">English</option>
    <option value="es" lang="es">Español</option>
  </select>
</label>
<main class="wrap"><h1 id="entrance-title">마음동화책방</h1><p class="sub" id="entrance-subtitle">서로의 마음을 천천히 만나는 곳</p><nav class="choices"><a class="btn primary" id="enter" href="livingroom/room/">거실로 들어가기</a><a class="btn" id="enter-library" href="previous-home.html" target="_blank" rel="noopener">도서관 가기</a><button class="btn" id="enter-experience" type="button" disabled>체험관 가기 · 준비 중</button></nav></main><div class="fade" id="fade"></div><script>
const entranceText = {
  ko: ['언어', '마음동화책방', '서로의 마음을 천천히 만나는 곳', '거실로 들어가기', '도서관 가기', '체험관 가기 · 준비 중'],
  en: ['Language', 'The Heart Storybook Library', 'A place to get to know each other at our own pace', 'Enter the living room', 'Visit the library', 'Activities · Coming soon'],
  es: ['Idioma', 'La biblioteca de los corazones', 'Un lugar para conocernos con calma', 'Entrar en la sala', 'Visitar la biblioteca', 'Actividades · Próximamente']
};
const languagePicker = document.getElementById('entrance-language');
const entranceUrl = new URL(location.href);
function showEntranceLanguage(lang) {
  const [label, title, subtitle, room, library, experience] = entranceText[lang];
  document.documentElement.lang = lang;
  document.title = title;
  languagePicker.value = lang;
  document.getElementById('language-label').textContent = label;
  document.getElementById('entrance-title').textContent = title;
  document.getElementById('entrance-subtitle').textContent = subtitle;
  const roomLink = document.getElementById('enter');
  roomLink.textContent = room;
  roomLink.href = 'livingroom/room/?lang=' + lang;
  const libraryLink = document.getElementById('enter-library');
  libraryLink.textContent = library;
  libraryLink.href = 'previous-home.html?lang=' + lang;
  document.getElementById('enter-experience').textContent = experience;
}
const requestedLanguage = entranceUrl.searchParams.get('lang');
showEntranceLanguage(Object.hasOwn(entranceText, requestedLanguage) ? requestedLanguage : 'ko');
languagePicker.addEventListener('change', () => {
  const lang = languagePicker.value;
  entranceUrl.searchParams.set('lang', lang);
  history.replaceState(null, '', entranceUrl);
  showEntranceLanguage(lang);
});
const enter=document.getElementById('enter');const fade=document.getElementById('fade');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;enter.addEventListener('click',function(e){if(e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;e.preventDefault();const url=enter.href;if(reduce){location.href=url;return}fade.classList.add('on');setTimeout(function(){location.href=url},700)});
</script></body></html>
