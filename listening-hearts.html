<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>소리로 헤아리는 마음 · 마음동화책방</title>
<style>
:root{color-scheme:light;--ink:#3f5148;--muted:#6f7b6b;--green:#617d67;--paper:#fffaf0}*{box-sizing:border-box}body{margin:0;background:#f5f0e5;color:var(--ink);font-family:'Malgun Gothic',system-ui,sans-serif;line-height:1.7}button,a{font:inherit}a{color:inherit}button{cursor:pointer}header{max-width:1160px;margin:auto;padding:26px 28px}.back{text-decoration:none;color:#657668}main{max-width:1100px;margin:auto;padding:10px 28px 90px}.intro{text-align:center;padding:22px 0 30px}.eyebrow{letter-spacing:.16em;color:#7d8c77;font-size:13px}.intro h1{font-family:Georgia,'Malgun Gothic',serif;font-weight:500;font-size:clamp(34px,5vw,52px);margin:8px 0}.intro p{font-size:18px;color:var(--muted);margin:0;word-break:keep-all}.entrance-art{display:block;width:100%;max-width:1000px;height:auto;aspect-ratio:3/2;object-fit:cover;border-radius:14px;margin:12px auto 8px}.shelf{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:0;text-decoration:none;color:inherit;cursor:pointer;border:1px solid #e0dacb;background:var(--paper);border-radius:18px;overflow:hidden;box-shadow:0 16px 40px #52634812}.cover{width:100%;height:auto;min-height:0;aspect-ratio:16/9;object-fit:cover}.details{padding:clamp(28px,5vw,56px);display:flex;flex-direction:column;justify-content:center}.tag{color:#8a7658;font-size:14px}.details h2{font-family:Georgia,serif;font-size:clamp(30px,4vw,42px);font-weight:500;margin:8px 0}.details p{word-break:keep-all;color:#647367}.primary,.secondary{border:0;border-radius:999px;padding:12px 24px}.primary{background:var(--green);color:white}.secondary{background:#eee9dd;color:var(--ink)}.collection-open{display:inline-block;color:#526b51;margin-top:18px}.note{text-align:center;color:#83907e;margin-top:36px;font-size:15px}.reader[hidden],.shelf-view[hidden]{display:none}.reader{max-width:1020px;margin:auto}.reader-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:10px 0 18px}.reader-top button{background:none;border:0;color:#66786d;padding:7px}.progress{color:#83907e;font-size:14px}.picture{width:100%;display:block;border-radius:14px;box-shadow:0 14px 35px #5263481a}.reader-content{text-align:center;padding:18px 12px}.reader-content h2{font-weight:500;font-size:clamp(23px,3vw,30px);margin:8px 0}.reader-content p{color:#728072;margin:7px 0 16px}.sound{display:flex;justify-content:center;margin:18px auto}.sound[hidden]{display:none}.sound button{background:#fefaf1;border:1px solid #bdcbbd;color:#496350;padding:10px 24px;border-radius:999px}.controls{display:flex;justify-content:center;gap:14px;margin-top:24px}.controls button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #b48c52;outline-offset:4px}@media(max-width:700px){header{padding:18px}main{padding:0 18px 60px}.shelf{grid-template-columns:1fr}.cover{min-height:0;aspect-ratio:16/10}.details{padding:28px}.intro{padding:18px 0 25px}.intro p{font-size:16px}.controls button{flex:1}.reader-top{margin-top:4px}}
</style></head><body><header><a class="back" href="./perspective-games.html">← 마음의 소리로</a></header><main>
<section class="shelf-view" id="shelf"><img class="entrance-art" src="./images/listening-hearts-entrance-calm.png" alt="따뜻한 정원에서 동물과 식물 곁에 앉아 조용히 귀 기울이는 아이들"><div class="intro"><h1>소리로 헤아리는 마음</h1><p>소리에 귀를 기울이고, 동물과 식물의 마음을 상상해요.<br>떠오르는 생각은 모두 소중해요.</p></div><a class="shelf" id="open" href="#story"><img class="cover" src="./images/milo-final/slide1.png" alt="마당에 앉아 있는 고양이 Milo"><div class="details"><span class="tag">첫 번째 이야기 · 고양이</span><h2>마일로의 우당탕탕 하루</h2><p>장난기 많은 고양이 Milo와 함께 하루를 걸어 볼까요? 소리를 듣고, Milo와 친구들의 마음을 천천히 상상해 봐요.</p><span class="collection-open">이야기 펼치기 →</span></div></a><p class="note">동물과 식물의 이야기가 이곳에 하나씩 모여요.</p></section>
<section class="reader" id="reader" hidden><div class="reader-top"><button id="shelf-back">← 이야기 책장으로</button><span class="progress" id="progress"></span></div><img class="picture" id="picture" alt=""><div class="reader-content"><h2 id="prompt"></h2><p id="hint">말로 나누거나, 마음속으로 조용히 생각해도 좋아요.</p><div class="sound" id="sound" hidden><button id="play" aria-pressed="false">▶ 소리 듣기</button></div><div class="controls"><button class="secondary" id="prev">← 이전 그림</button><button class="primary" id="next">다음 그림 →</button></div></div></section>
</main><script>
const scenes=[
[1,'Milo의 하루를 함께 따라가 볼까요?',null,'마당에 앉아 있는 고양이 Milo'],
[2,'어떤 소리가 들리나요? Milo는 어떤 기분일까요?','sound1.mp3','침대에서 바라본 아침 풍경'],
[3,'Milo는 거실에서 무엇을 하고 있나요?','sound1.mp3','거실에서 기지개를 켜는 Milo'],
[4,'무슨 소리가 가까워지고 있을까요?','sound2.mp3','계단 쪽을 바라보는 Milo의 시야'],
[5,'Milo는 무엇에 놀랐을까요?','sound2.mp3','공을 보고 부엌으로 달리는 Milo'],
[6,'문밖에서 무엇이 기다리고 있을까요?','sound3.mp3','작은 문 너머로 보이는 마당'],
[7,'새들은 나무에서 무엇을 보고 있을까요?','sound3.mp3','마당에서 새들을 만난 Milo'],
[8,'울타리 너머에는 누가 있을까요?','sound4.mp3','울타리 틈으로 보이는 작은 꼬리'],
[9,'두 고양이는 각각 어떤 마음일까요?','sound4.mp3','울타리 사이에서 만난 두 고양이'],
[10,'저녁이 되었어요. Milo는 어디로 갈까요?','sound5.mp3','따뜻한 불빛이 보이는 작은 문'],
[11,'오늘 하루 중 어떤 장면이 마음에 남았나요?','sound6.mp3','집에서 쉬고 있는 Milo']];
let current=0;const shelf=document.querySelector('#shelf'),reader=document.querySelector('#reader'),pic=document.querySelector('#picture'),prompt=document.querySelector('#prompt'),sound=document.querySelector('#sound'),play=document.querySelector('#play'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),audio=new Audio();audio.preload='none';
function stop(){audio.pause();audio.currentTime=0;play.textContent='▶ 소리 듣기';play.setAttribute('aria-pressed','false')}
function show(){stop();const [image,question,track,alt]=scenes[current];pic.src=`./images/milo-final/slide${image}.png`;pic.alt=alt;prompt.textContent=question;document.querySelector('#progress').textContent=`${current+1} / ${scenes.length}`;sound.hidden=!track;if(track)audio.src=`./audio/milo-final/${track}`;prev.disabled=current===0;next.textContent=current===scenes.length-1?'책장으로 돌아가기':'다음 그림 →';window.scrollTo(0,0)}
document.querySelector('#open').onclick=(event)=>{event.preventDefault();shelf.hidden=true;reader.hidden=false;current=0;show()};document.querySelector('#shelf-back').onclick=()=>{stop();reader.hidden=true;shelf.hidden=false;window.scrollTo(0,0)};prev.onclick=()=>{if(current>0){current--;show()}};next.onclick=()=>{if(current<scenes.length-1){current++;show()}else document.querySelector('#shelf-back').click()};play.onclick=async()=>{if(!audio.paused){stop();return}try{await audio.play();play.textContent='Ⅱ 소리 멈추기';play.setAttribute('aria-pressed','true')}catch{play.textContent='소리를 불러오지 못했어요'}};audio.onended=stop;document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});
</script></body></html>
