<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>마음 탐정 연습실 · 마음동화책방</title><link rel="stylesheet" href="./simple-navigation.css"><style>body{margin:0;background:#faf6ed;color:#4d5745;font-family:"Malgun Gothic",sans-serif;line-height:1.8}main{max-width:900px;margin:20px auto;padding:0 22px 50px}h1{font-weight:500;font-size:30px;text-align:center}h2{font-size:21px;font-weight:500}.intro{text-align:center;color:#7d806f}section{background:#fffaf0;border:1px solid #e7ddc9;border-radius:22px;padding:24px;margin:22px 0}.big-link{display:inline-block;padding:13px 22px;background:#7c9273;color:white;border-radius:24px;text-decoration:none}.practice-art{position:relative;border-radius:20px;overflow:hidden}.practice-art img{width:100%;display:block}.practice-spot{position:absolute;transform:translate(-50%,-50%);font-size:25px;border:0;border-radius:50%;padding:9px;background:#fff9e9d9;cursor:pointer}.practice-tools{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:20px 0}.practice-tools button{font:inherit;border:1px solid #d6cdb8;border-radius:20px;background:#fffaf0;padding:10px 16px;cursor:pointer}.practice-tools button[aria-pressed=true]{background:#dce8d5}.key-message{min-height:70px;padding:20px;border-radius:18px;background:#edf1e5;text-align:center}.soft-note{color:#817b6a;font-size:14px}.parent-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}@media(max-width:600px){.parent-grid{grid-template-columns:1fr}h1{font-size:26px}section{padding:20px}}</style></head><body><main><h1>🧭 마음 탐정 연습실</h1><p class="intro">마음을 알아가는 작은 시작, 마음 열쇠를 만나봐요.</p><section><h2>그림에서 어떤 모습이 보이나요?</h2><div class="practice-art"><img src="./images/bakery-2.png" alt="급하게 들어온 하준과 기다리던 서연이 있는 빵집"><button class="practice-spot" data-key="0" style="left:51%;top:27%" aria-label="하준의 이마 살펴보기">👀</button><button class="practice-spot" data-key="1" style="left:43%;top:46%" aria-label="하준이 한 말 살펴보기">👂</button><button class="practice-spot" data-key="2" style="left:64%;top:78%" aria-label="두 사람의 서 있는 자리 살펴보기">🏃</button></div><div class="practice-tools"><button data-key="0">👀 눈 열쇠</button><button data-key="1">👂 귀 열쇠</button><button data-key="2">🏃 행동 열쇠</button></div><div id="key-message" class="key-message" role="status">그림 속 아이콘을 누르거나 아래 열쇠를 골라보세요.</div><p class="soft-note">귀 열쇠에서는 이야기 속 말을 읽어요. 실제 녹음 소리는 나오지 않아요.</p></section><section><h2>찾은 모습과 내 생각은 달라요</h2><p>“이마에 땀이 있어요”는 눈으로 본 모습이에요.<br>“급하게 왔을지도 몰라요”는 내가 짐작한 마음이에요.</p><p>표정 하나만으로 마음을 꼭 정하지 않아요. 아직 모르는 마음은 남겨 두고, 서로의 말을 들어보아요.</p><a class="big-link" href="./index.html#children">📖 마음 동화책 읽으러 가기</a></section></main><script src="./simple-navigation.js"></script><script>const messages=["👀 눈 열쇠: 이마에 땀이 맺혔어요. 서둘러 왔을 수도 있겠어요.","👂 귀 열쇠: 이야기에서 하준이 빠르게 ‘빵 두 개 주세요!’라고 말했어요.","🏃 행동 열쇠: 하준이 먼저 기다리던 서연의 앞에 섰어요. 서연은 어떻게 느꼈을까요?"];document.querySelectorAll("[data-key]").forEach(b=>{const show=()=>{document.getElementById("key-message").textContent=messages[Number(b.dataset.key)];document.querySelectorAll(".practice-tools button").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.key===b.dataset.key)));};b.onclick=show;b.onmouseenter=show;b.onfocus=show;});</script></body></html>
