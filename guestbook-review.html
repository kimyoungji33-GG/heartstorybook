<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>방문록 검토 도구</title><link rel="stylesheet" href="./nature.css?v=20261014-nature62"><link rel="stylesheet" href="./keepsakes.css?v=20261014-nature62"></head><body class="review-page"><main><a class="back" href="./keepsakes.html">← 선물 꾸러미로</a><h1>방문록 엽서 살펴보기</h1><p>이 도구는 파일을 이 기기에서 확인하는 도구예요. 로그인이나 온라인 관리자 권한 기능은 아니에요. 아래에서 내보낸 승인 목록을 책방지기가 홈페이지 파일에 반영해야 공개돼요.</p><label>지금 공개 중인 목록 불러오기 · 선택<input id="approved" type="file" accept=".json"></label><p><label>방문자가 전달한 검토용 엽서<input id="submission" type="file" accept=".json"></label></p><div id="review" class="note review-preview"></div><div class="reading-nav"><button id="accept" disabled>이 엽서를 공개 목록에 넣기</button><button id="reject" disabled>공개하지 않기</button><button id="export">승인 목록 파일 내려받기</button></div><p id="status" role="status"></p><p class="quiet">내용·이름·그림을 직접 확인하세요. 개인 정보, 타인 비방, 허락 없이 공개한 자료는 공개 목록에 넣지 않아요. 이 페이지에서 선택한 것만으로 사이트는 바뀌지 않아요.</p></main><script src="./guestbook-review.js?v=20261014-nature62"></script></body></html>
