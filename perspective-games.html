  <script>
    'use strict';
    // 실제 음원 파일 이름에 맞게 아래 경로를 바꾸면 됩니다.
    const SOUND_ROUNDS=[{"id":"water","options":[["소풍 가기 전 물병을 채우는 아침","Filling a water bottle before a picnic","Llenar una botella antes de un pícnic"],["작은 시냇가에서 쉬는 시간","Resting beside a little stream","Descansar junto a un arroyo"],["따뜻한 차 한 잔을 준비하는 손","Preparing a warm cup of tea","Preparar una taza de té calentito"],["화분에 물을 주는 햇살 좋은 날","Watering plants on a sunny day","Regar las plantas en un día soleado"]],"src":"./audio/everyday-water.mp3"},{"id":"cooking","options":[["맛있는 아침을 준비하는 부엌","A kitchen making a lovely breakfast","Una cocina que prepara un rico desayuno"],["비가 톡톡 두드리는 포근한 지붕","Rain tapping on a cosy roof","La lluvia sobre un tejado acogedor"],["친구들과 둘러앉은 작은 모닥불","Friends gathered around a little fire","Amigos junto a una pequeña fogata"],["조개껍데기 곁으로 밀려오는 파도","Waves rolling past seashells","Las olas junto a las conchas"]],"src":"./audio/everyday-cooking.mp3"},{"id":"grain","options":[["새들에게 작은 씨앗을 나누는 손","Sharing little seeds with birds","Compartir pequeñas semillas con los pájaros"],["예쁜 돌을 모아 꾸미는 작은 정원","A little garden made with pretty pebbles","Un jardincito con piedras bonitas"],["나뭇잎 위로 톡톡 내리는 빗방울","Raindrops pattering on leaves","Gotitas de lluvia sobre las hojas"],["모래성을 만들며 모래를 붓는 순간","Pouring sand to build a sandcastle","Echar arena para hacer un castillo"]],"src":"./audio/everyday-grain.mp3"},{"id":"sweeping","options":[["큰 붓으로 종이에 그림을 그리는 시간","Painting on paper with a big brush","Pintar sobre papel con un pincel grande"],["친구를 맞으려고 방을 정리하는 오후","Tidying a room before a friend visits","Ordenar la habitación para recibir a una amistad"],["바스락 낙엽길을 함께 걷는 산책","A walk together through rustling leaves","Pasear juntos entre hojas que crujen"],["산들바람에 살랑이는 커튼","Curtains swaying in a gentle breeze","Cortinas que bailan con una brisa suave"]],"src":"./audio/everyday-sweeping.mp3"},{"id":"bread","options":[["따뜻한 빵을 나누는 아침 식탁","A breakfast table sharing warm bread","Una mesa que comparte pan calentito"],["뽀드득 눈길에 남기는 작은 발자국","Little footsteps in crunchy snow","Pequeñas huellas en la nieve"],["나무 조각을 다듬는 아늑한 공방","A cosy workshop shaping a piece of wood","Un taller acogedor que trabaja la madera"],["모래사장에서 보물을 찾는 발걸음","Looking for treasures along a sandy beach","Buscar tesoros en una playa de arena"]],"src":"./audio/everyday-bread.mp3"}];
    let soundRound=0;
    const AUDIO_SOURCE='./audio/everyday-water.mp3';
    const soundLocale=()=>window.heartLanguage?.()||'ko';
    const soundWord=(ko,en,es)=>soundLocale()==='en'?en:soundLocale()==='es'?es:ko;
    function roundChoices(){return worlds.map((w,i)=>({...w,label:SOUND_ROUNDS[soundRound].options[i][soundLocale()==='en'?1:soundLocale()==='es'?2:0]}));}
    function roundPicker(){return `<nav class="sound-rounds" aria-label="${soundWord('다섯 가지 소리','Five sounds','Cinco sonidos')}">${SOUND_ROUNDS.map((r,i)=>`<button data-sound-round="${i}" aria-pressed="${i===soundRound}">${soundWord('소리','Sound','Sonido')} ${i+1}</button>`).join('')}</nav>`;}
    const app=document.getElementById('app');
    const announcement=document.getElementById('announcement');
    const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
    let screen='home',generation=0,transitionTimer=null,enteredTitle='';
    let audioContext=null,notes=[],noteTimer=null,isPlaying=false,useDemoSound=false;
    const audio=new Audio();audio.preload='none';audio.src=AUDIO_SOURCE;audio.volume=.75;audio.id='everyday-sound-player';audio.hidden=true;document.body.append(audio);
    const worlds=[
      {id:'forest',letter:'A',icon:'🌿',label:'고요하고 평화로운 새벽 숲'},
      {id:'city',letter:'B',icon:'☀️',label:'활기차고 바쁜 도시의 오후'},
      {id:'rain',letter:'C',icon:'🌧️',label:'비 내리는 창가와 슬픔'},
      {id:'adventure',letter:'D',icon:'✨',label:'미지의 세계를 향한 모험'}
    ];
    function announce(text){announcement.textContent=text;}
    function focusHeading(){const h=app.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}
        function resetPresentation(){announcement.textContent='';app.classList.remove('discarding');clearTimeout(transitionTimer);transitionTimer=null;generation++;stopSound();document.body.classList.remove('night');document.body.removeAttribute('data-world');document.querySelectorAll('.star-sky,.transition-shade').forEach(e=>e.remove());}
    function setScreen(name){resetPresentation();screen=name;enteredTitle='';}
    function home(){intro();}
    function intro(){setScreen('sound-intro');app.innerHTML=`<section class="screen intro center"><a class="back-link" href="./index.html">← 책방 입구로</a><div class="sound-illustration" role="img" aria-label="헤드폰으로 소리를 듣고 편안하게 풍경을 상상하는 어린이"></div><h1>마음의 소리</h1><p class="lead">소리를 듣고, 마음에 떠오르는 풍경을 만나 봐요.</p><div class="actions"><button id="start" class="primary">소리 만나러 가기 →</button></div></section>`;document.getElementById('start').onclick=soundPlay;focusHeading();}
    function updateAudioButton(){if(screen!=='sound-play')return;const button=document.getElementById('audio-play');button.textContent=isPlaying?'Ⅱ':'▶';button.setAttribute('aria-label',isPlaying?'소리 멈추기':'소리 재생하기');button.classList.toggle('playing',isPlaying);document.getElementById('audio-label').textContent=isPlaying?(useDemoSound?'예시 도레미 소리를 듣고 있어요.':'음원을 듣고 있어요.'):'소리를 다시 들어도 좋아요.';}
    function stopSound(){audio.pause();try{audio.currentTime=0;}catch{}clearTimeout(noteTimer);noteTimer=null;for(const oscillator of notes){try{oscillator.stop();}catch{}try{oscillator.disconnect();}catch{}}notes=[];isPlaying=false;updateAudioButton();}
    async function demoSound(token=generation){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw new Error('이 브라우저에서는 예시 소리를 만들 수 없어요. 다른 브라우저나 실제 음원을 사용해 주세요.');if(!audioContext)audioContext=new AudioContextClass();await audioContext.resume();if(screen!=='sound-play'||token!==generation||document.hidden)return;const start=audioContext.currentTime+.04;const frequencies=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];frequencies.forEach((frequency,index)=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;const at=start+index*.45;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.085,at+.03);gain.gain.exponentialRampToValueAtTime(.001,at+.37);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(at);oscillator.stop(at+.4);oscillator.onended=()=>{gain.disconnect();};notes.push(oscillator);});isPlaying=true;updateAudioButton();noteTimer=setTimeout(()=>{notes=[];isPlaying=false;updateAudioButton();},3800);}
    async function toggleSound(){if(isPlaying){stopSound();return;}const button=document.getElementById('audio-play');button.disabled=true;const token=generation;try{if(useDemoSound)await demoSound(token);else{try{await audio.play();if(token!==generation){audio.pause();return;}isPlaying=true;updateAudioButton();}catch(error){if(token!==generation)return;if(error.name==='NotAllowedError')throw new Error('소리 재생을 허용한 뒤 다시 눌러 주세요.');throw new Error(soundWord('소리를 불러오지 못했어요. 다른 소리를 골라 보세요.','The sound could not load. Choose another sound.','No se pudo cargar el sonido. Elige otro.'));}}}catch(error){if(screen==='sound-play'){document.getElementById('sound-note').textContent=error.message;announce(error.message);}}finally{if(screen==='sound-play')button.disabled=false;}}
    audio.addEventListener('ended',()=>{isPlaying=false;updateAudioButton();});
    audio.addEventListener('error',()=>{if(screen==='sound-play'){document.getElementById('sound-note').textContent=soundWord('소리를 불러오지 못했어요. 다시 누르거나 다른 소리를 골라 보세요.','The sound could not load. Try again or choose another sound.','No se pudo cargar el sonido. Prueba otra vez o elige otro.');}});
    function soundPlay(){setScreen('sound-play');useDemoSound=false;audio.src=SOUND_ROUNDS[soundRound].src;audio.load();app.innerHTML=`<section class="screen center"><button class="ghost back" id="main">← 메인으로</button><div class="kicker">내 귀에서 마음속 풍경으로</div>${roundPicker()}<h1>어떤 소리 같나요?</h1><button id="audio-play" class="audio-button" aria-label="소리 재생하기">▶</button><p id="audio-label" class="audio-label">눌러서 소리를 들어보세요.</p><p id="sound-note" class="soft-note">무엇인지 맞히기보다, 떠오르는 기억이나 풍경을 만나 봐요.</p><div class="sound-choices">${roundChoices().map(world=>`<button data-world="${world.id}"><span>${world.label}</span></button>`).join('')}</div><p class="soft-note">보기와 다른 상상이 떠올라도 좋아요. 가장 가까운 풍경을 골라 보세요.</p></section>`;document.getElementById('main').onclick=home;document.getElementById('audio-play').onclick=toggleSound;app.querySelectorAll('[data-world]').forEach(button=>button.onclick=()=>soundResult(button.dataset.world));app.querySelectorAll('[data-sound-round]').forEach(button=>button.onclick=()=>{soundRound=Number(button.dataset.soundRound);soundPlay();});focusHeading();}
    function soundResult(id){const world=roundChoices().find(value=>value.id===id);if(!world)return;resetPresentation();screen='sound-result';document.body.dataset.world=world.id;app.innerHTML=`<section class="screen sound-result center"><div class="kicker">같은 소리도, 서로 다른 마음에 닿아요</div><div class="result-symbol" aria-hidden="true">${world.icon}</div><h1>정답은 없습니다.</h1><p class="chosen-world">내 마음이 떠올린 풍경 · ${world.label}</p><p>같은 소리를 들어도 서로 다른 기억과 풍경이 떠오를 수 있어요. 오늘 내 마음에는 이런 장면이 찾아왔네요.</p><p class="soft-note">어떤 모습이 보였나요? 누구와 함께 있었나요? 떠오른 이야기를 마음속으로 조금 더 이어 보아도 좋아요.</p><div class="actions"><button id="retry" class="primary">같은 소리 다시 듣기</button><button id="next-sound">다른 소리 만나기 →</button><button id="main">메인으로</button></div></section>`;document.getElementById('retry').onclick=soundPlay;document.getElementById('next-sound').onclick=()=>{soundRound=(soundRound+1)%SOUND_ROUNDS.length;soundPlay();};document.getElementById('main').onclick=home;focusHeading();}
    // 탭을 떠나면 소리를 멈추어 갑자기 계속 재생되지 않게 합니다.
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSound();});
    window.addEventListener('pagehide',()=>{stopSound();clearTimeout(transitionTimer);});
    home();
  </script>
