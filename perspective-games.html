<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="소리를 들으며 서로 다른 마음의 풍경을 만나는 놀이">
  <title>마음동화책방 · 마음의 소리</title>
  <style>
    :root{--ink:#344c50;--muted:#586e70;--paper:#fffdf6;--accent:#46686c;--line:#c5d8d3;--soft:#edf5ef}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif;line-height:1.75;background:linear-gradient(140deg,#f7eddf,#e6f0e8 50%,#e8edf6);transition:background 1.2s,color .8s}
    button,input{font:inherit}button{cursor:pointer;color:inherit}button:disabled{cursor:default;opacity:.65}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #b76c38;outline-offset:5px}button{border:1px solid var(--line);border-radius:17px;background:#fffcf3;padding:13px 23px;transition:transform .2s,background .2s}button:hover:enabled{transform:translateY(-2px);background:#edf5ed}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover:enabled{background:#365358;color:white}.ghost{background:transparent;font-size:13px;padding:8px 15px}
    header{max-width:1120px;margin:auto;padding:23px 24px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:17px;font-weight:650;letter-spacing:-.4px}header span{font-size:12px;color:var(--muted)}main{max-width:1050px;padding:24px;margin:auto;min-height:70vh}h1,h2{font-family:Georgia,'Batang',serif;font-weight:500;line-height:1.5}h1{font-size:clamp(28px,4vw,43px);margin:14px 0 20px;letter-spacing:-1px}h2{font-size:26px;margin:10px 0}.kicker{font-size:13px;letter-spacing:1px;color:var(--muted)}.lead{font-size:17px;color:var(--muted);max-width:690px;margin:0 auto 22px}.center{text-align:center}.intro{max-width:780px;margin:35px auto;padding:0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:23px;margin:35px 0}.game-card{border:1px solid #cbd9d2;border-radius:27px;background:#fffcf2b8;text-align:left;padding:30px;box-shadow:0 12px 35px #365b5010}.game-card p{font-size:15px;color:var(--muted)}.art{height:155px;position:relative;border-radius:19px;overflow:hidden;margin-bottom:23px;background:linear-gradient(130deg,#d4e2da,#f6e6c8)}.art-photo::before,.art-photo::after{content:'';position:absolute;inset:25px 20%;border:9px solid #fffdf4;border-bottom-width:24px;background:linear-gradient(145deg,#bad1cf,#e9d4b6);box-shadow:0 8px 20px #3e615329;transform:rotate(-10deg)}.art-photo::after{inset:35px 27%;transform:rotate(13deg);background:radial-gradient(circle at 70% 30%,#fff1b7 0 13%,transparent 14%),linear-gradient(150deg,#a4c7c2,#cbd7b4)}.art-sound{display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(140deg,#dedaf1,#f5e5dc)}.art-sound i{width:6px;height:var(--height);background:#8399a9;border-radius:9px}.soft-note{font-size:13px;color:var(--muted);max-width:700px;margin:22px auto;text-align:center}.screen{animation:arrive .6s ease-out}.panel{background:#fffdf6ca;border:1px solid var(--line);border-radius:27px;padding:30px;max-width:700px;margin:25px auto;box-shadow:0 10px 35px #395e5110}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:28px}.back{margin-bottom:18px}.photo-stack{max-width:540px;margin:25px auto;transform-origin:center center}.photo-frame{background:#fffdf8;border-radius:7px;padding:14px 14px 20px;box-shadow:0 15px 40px #36585020}.photo-frame>img{display:block;width:100%;height:320px;object-fit:contain;background:#eef1e7;border-radius:3px}.demo-art{height:320px;background:#e8ecdf;display:grid;place-items:center;border-radius:3px}.demo-art[hidden]{display:none}.demo-art svg{height:100%;width:100%;max-width:420px}.media-note{font-size:12px;color:#64766c;text-align:center;margin:10px 0 0}.photo-caption{padding:14px 7px 3px;text-align:center;color:#556e65;min-height:42px;overflow-wrap:anywhere}label{display:block;font-size:16px;margin-bottom:12px}input{width:100%;padding:14px 16px;border:1px solid #bdcfc5;border-radius:12px;background:#fffdf6;color:#344c50}form .primary{margin-top:18px}.input-count{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;margin-top:8px}.error{min-height:24px;color:#8d4833;font-size:13px}.discarding .photo-stack{animation:discard 1.1s ease-in both}.discarding .photo-form{animation:fade-out .6s both}.transition-shade{position:fixed;inset:0;background:#14243d;pointer-events:none;opacity:0;z-index:10;animation:shade-in 1.15s ease-in both}.night{background:#14233a;color:#f7f4e9;--ink:#f7f4e9;--muted:#d0dbe2;--line:#61748a;--accent:#e5d8aa}.night header{position:relative;z-index:1}.night .primary{background:#e5d8aa;color:#26384f;border-color:#e5d8aa}.night button:hover:enabled{background:#f0e4bf;color:#26384f}.night .ghost{color:#eff0e9;border-color:#8295a5}.night .star-sky{position:fixed;inset:0;overflow:hidden;pointer-events:none;background:radial-gradient(ellipse at 25% 20%,#56729755,transparent 55%),radial-gradient(ellipse at 80% 85%,#b289ad33,transparent 50%);z-index:0}.star-sky i{position:absolute;background:#fff4cc;width:3px;height:3px;border-radius:50%;box-shadow:0 0 8px #fff4aa90;opacity:.55;animation:star-breathe 7s infinite;animation-delay:var(--delay)}.cosmos{position:relative;z-index:1;text-align:center}.cosmos h1{max-width:760px;margin:28px auto;font-size:clamp(25px,3.5vw,36px)}.interpretations{position:relative;min-height:300px;list-style:none;padding:0;margin:25px auto;max-width:800px}.interpretations li{position:absolute;left:var(--x);top:var(--y);transform:translate(-50%,-50%);padding:9px 20px;border:1px solid #8eabc044;border-radius:50px;background:#2f42523b;color:#eef0e8;white-space:nowrap;animation:word-arrive 1.7s ease-out both,float-word 7s ease-in-out 1.7s infinite;animation-delay:var(--delay)}.interpretations li::before{content:'✦';font-size:10px;color:#ecdba2;margin-right:9px}.interpretation-note{font-size:13px;color:#ccd9df}.quote{font-size:20px;overflow-wrap:anywhere;max-width:680px;margin:20px auto}.audio-button{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;margin:25px auto;background:#fffdf5;box-shadow:0 0 0 12px #ffffff3b,0 12px 32px #42586818;border:1px solid #c2d4d2;font-size:44px}.audio-button.playing{animation:audio-breathe 2.5s infinite}.audio-label{text-align:center;font-size:14px;color:var(--muted);min-height:28px}.sound-choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:820px;margin:28px auto}.sound-choices button{text-align:left;padding:20px 22px;background:#fffdf6cb}.sound-choices b{display:block;font-size:22px;margin-bottom:8px}.sound-choices span{font-size:16px}.result-symbol{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;font-size:55px;margin:25px auto;background:#fffdf48c;box-shadow:0 10px 30px #3e5e4c12}.sound-result{max-width:760px;margin:auto}.sound-result p{font-size:17px;line-height:2}.chosen-world{font-size:15px;color:var(--muted)}body[data-world=forest]{background:linear-gradient(135deg,#eef1df,#cfe3d5,#e8eddf)}body[data-world=city]{background:linear-gradient(135deg,#fff0cf,#edc5ad,#f5e7d5)}body[data-world=rain]{background:linear-gradient(135deg,#e8eff3,#cddbeb,#ecdfdf)}body[data-world=adventure]{background:linear-gradient(135deg,#eee6f4,#ddd5ea,#f5e3d1)}footer{position:relative;z-index:1;text-align:center;color:var(--muted);padding:25px;font-size:12px}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes arrive{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes discard{0%{opacity:1;transform:scale(1) translateY(0) rotate(0)}45%{opacity:.8;transform:scale(.6) translateY(100px) rotate(8deg)}100%{opacity:0;transform:scale(.04) translateY(1000px) rotate(-12deg)}}@keyframes fade-out{to{opacity:0}}@keyframes shade-in{0%,30%{opacity:0}100%{opacity:1}}@keyframes star-breathe{50%{opacity:.25}}@keyframes word-arrive{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}@keyframes float-word{50%{margin-top:-9px}}@keyframes audio-breathe{50%{box-shadow:0 0 0 19px #ffffff40,0 12px 32px #42586818}}@media(max-width:650px){header{padding:18px;align-items:start;flex-direction:column;gap:0}main{padding:18px}.grid{grid-template-columns:1fr;gap:18px}.game-card{padding:23px}.art{height:120px}.intro{margin:20px auto}.panel{padding:23px}.photo-frame>img,.demo-art{height:260px}.sound-choices{grid-template-columns:1fr}.interpretations{min-height:350px}.interpretations li{font-size:14px;padding:8px 12px}.lead{font-size:15px}.quote{font-size:17px}.input-count{flex-direction:column;gap:0}.sound-result p{font-size:16px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.discarding .photo-stack,.discarding .photo-form{opacity:0}.transition-shade{opacity:1}}
    h1[tabindex="-1"]:focus{outline:none}
    .sound-illustration{height:auto;aspect-ratio:3/2;border-radius:27px;background:url('./images/sound-listening-cover.png') center/cover no-repeat;margin:22px auto 24px;max-width:580px}.back-link{display:block;text-align:left;text-decoration:none;color:var(--muted);font-size:14px}.intro{margin-top:5px}.sound-choices button{border-radius:20px;min-height:140px;background:linear-gradient(140deg,#f7f3df,#d9e8d8)}.sound-choices button[data-world=city]{background:linear-gradient(140deg,#fff0ce,#efd3bd)}.sound-choices button[data-world=rain]{background:linear-gradient(140deg,#e5eff3,#dbdbea)}.sound-choices button[data-world=adventure]{background:linear-gradient(140deg,#eee2f1,#f3dfce)}@media(max-width:650px){.sound-illustration{height:auto}.sound-choices{grid-template-columns:1fr 1fr;gap:10px}.sound-choices button{padding:16px 13px}.sound-choices span{font-size:14px}}
  </style>

<body class="heart-tools-page">
  <header><div class="brand">마음동화책방</div><span>소리 하나, 서로 다른 풍경</span></header>
  <main id="app"></main>
  <div id="announcement" class="sr-only" role="status" aria-live="polite"></div>
  <footer>적은 내용과 선택은 저장하거나 다른 곳으로 보내지 않아요.</footer>
  <script>
    'use strict';
    // 실제 음원 파일 이름에 맞게 아래 경로를 바꾸면 됩니다.
    const AUDIO_SOURCE='./audio/mind-sound.mp3';
    const app=document.getElementById('app');
    const announcement=document.getElementById('announcement');
    const reducedMotion=window.matchMedia('(prefers-reduced-motion: reduce)');
    let screen='home',generation=0,transitionTimer=null,enteredTitle='';
    let audioContext=null,notes=[],noteTimer=null,isPlaying=false,useDemoSound=false;
    const audio=new Audio();audio.preload='none';audio.src=AUDIO_SOURCE;
    const worlds=[
      {id:'forest',letter:'A',icon:'🌿',label:'고요하고 평화로운 새벽 숲'},
      {id:'city',letter:'B',icon:'☀️',label:'활기차고 바쁜 도시의 오후'},
      {id:'rain',letter:'C',icon:'🌧️',label:'비 내리는 창가와 슬픔'},
      {id:'adventure',letter:'D',icon:'✨',label:'미지의 세계를 향한 모험'}
    ];
    function announce(text){announcement.textContent=text;}
    function focusHeading(){const h=app.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true});}}
        function resetPresentation(){announcement.textContent='';app.classList.remove('discarding');clearTimeout(transitionTimer);transitionTimer=null;generation++;stopSound();document.body.classList.remove('night');document.body.removeAttribute('data-world');document.querySelectorAll('.star-sky,.transition-shade').forEach(e=>e.remove());}
    function setScreen(name){resetPresentation();screen=name;enteredTitle='';}
    function home(){intro();}
    function intro(){setScreen('sound-intro');app.innerHTML=`<section class="screen intro center"><a class="back-link" href="./index.html">← 마음동화책방</a><div class="sound-illustration" role="img" aria-label="헤드폰으로 소리를 듣고 편안하게 풍경을 상상하는 어린이"></div><h1>마음의 소리</h1><p class="lead">소리를 듣고, 마음에 떠오르는 풍경을 만나 봐요.</p><div class="actions"><button id="start" class="primary">소리 만나러 가기 →</button></div></section>`;document.getElementById('start').onclick=soundPlay;focusHeading();}
    function updateAudioButton(){if(screen!=='sound-play')return;const button=document.getElementById('audio-play');button.textContent=isPlaying?'Ⅱ':'▶';button.setAttribute('aria-label',isPlaying?'소리 멈추기':'소리 재생하기');button.classList.toggle('playing',isPlaying);document.getElementById('audio-label').textContent=isPlaying?(useDemoSound?'예시 도레미 소리를 듣고 있어요.':'음원을 듣고 있어요.'):'소리를 다시 들어도 좋아요.';}
    function stopSound(){audio.pause();try{audio.currentTime=0;}catch{}clearTimeout(noteTimer);noteTimer=null;for(const oscillator of notes){try{oscillator.stop();}catch{}try{oscillator.disconnect();}catch{}}notes=[];isPlaying=false;updateAudioButton();}
    async function demoSound(token=generation){const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw new Error('이 브라우저에서는 예시 소리를 만들 수 없어요. 다른 브라우저나 실제 음원을 사용해 주세요.');if(!audioContext)audioContext=new AudioContextClass();await audioContext.resume();if(screen!=='sound-play'||token!==generation||document.hidden)return;const start=audioContext.currentTime+.04;const frequencies=[261.63,293.66,329.63,349.23,392,440,493.88,523.25];frequencies.forEach((frequency,index)=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain();oscillator.type='sine';oscillator.frequency.value=frequency;const at=start+index*.45;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.085,at+.03);gain.gain.exponentialRampToValueAtTime(.001,at+.37);oscillator.connect(gain);gain.connect(audioContext.destination);oscillator.start(at);oscillator.stop(at+.4);oscillator.onended=()=>{gain.disconnect();};notes.push(oscillator);});isPlaying=true;updateAudioButton();noteTimer=setTimeout(()=>{notes=[];isPlaying=false;updateAudioButton();},3800);}
    async function toggleSound(){if(isPlaying){stopSound();return;}const button=document.getElementById('audio-play');button.disabled=true;const token=generation;try{if(useDemoSound)await demoSound(token);else{try{await audio.play();if(token!==generation){audio.pause();return;}isPlaying=true;updateAudioButton();}catch(error){if(token!==generation)return;if(error.name==='NotAllowedError')throw new Error('소리 재생을 허용한 뒤 다시 눌러 주세요.');useDemoSound=true;document.getElementById('sound-note').textContent='음원 파일이 아직 없어, 부드러운 도레미 예시 소리를 들려드려요.';await demoSound(token);}}}catch(error){if(screen==='sound-play'){document.getElementById('sound-note').textContent=error.message;announce(error.message);}}finally{if(screen==='sound-play')button.disabled=false;}}
    audio.addEventListener('ended',()=>{isPlaying=false;updateAudioButton();});
    audio.addEventListener('error',()=>{useDemoSound=true;});
    function soundPlay(){setScreen('sound-play');app.innerHTML=`<section class="screen center"><button class="ghost back" id="main">← 메인으로</button><div class="kicker">내 귀에서 마음속 풍경으로</div><h1>어떤 세계가 떠오르나요?</h1><button id="audio-play" class="audio-button" aria-label="소리 재생하기">▶</button><p id="audio-label" class="audio-label">눌러서 소리를 들어보세요.</p><p id="sound-note" class="soft-note">음원 파일이 없으면 부드러운 도레미 예시 소리로 바뀌어요.</p><div class="sound-choices">${worlds.map(world=>`<button data-world="${world.id}"><b aria-hidden="true">${world.icon}</b><span>${world.letter}. ${world.label}</span></button>`).join('')}</div><p class="soft-note">지금 내 마음에 가까운 풍경을 골라요. 다시 듣고 다른 풍경을 골라도 괜찮아요.</p></section>`;document.getElementById('main').onclick=home;document.getElementById('audio-play').onclick=toggleSound;app.querySelectorAll('[data-world]').forEach(button=>button.onclick=()=>soundResult(button.dataset.world));focusHeading();}
    function soundResult(id){const world=worlds.find(value=>value.id===id);if(!world)return;resetPresentation();screen='sound-result';document.body.dataset.world=world.id;app.innerHTML=`<section class="screen sound-result center"><div class="kicker">같은 소리도, 서로 다른 마음에 닿아요</div><div class="result-symbol" aria-hidden="true">${world.icon}</div><h1>정답은 없습니다.</h1><p class="chosen-world">내 마음이 떠올린 풍경 · ${world.label}</p><p>동일한 소리(도레미파솔라시도)라도 연주하는 악기와 듣는 사람의 마음에 따라 모두 다른 모양의 세계로 표현됩니다. 당신의 관점은 틀린 것이 아니라, 당신만의 아름다운 세계입니다.</p><p class="soft-note">슬픈 풍경이 떠올라도 괜찮아요. 다른 느낌으로 바꾸거나, 지금의 느낌을 그대로 두어도 좋아요.</p><div class="actions"><button id="retry" class="primary">다시 하기</button><button id="main">메인으로</button></div></section>`;document.getElementById('retry').onclick=soundPlay;document.getElementById('main').onclick=home;focusHeading();}
    // 탭을 떠나면 소리를 멈추어 갑자기 계속 재생되지 않게 합니다.
    document.addEventListener('visibilitychange',()=>{if(document.hidden)stopSound();});
    window.addEventListener('pagehide',()=>{stopSound();clearTimeout(transitionTimer);});
    home();
  </script>
<script src="./heart-language.js?v=20261011-audio20"></script><script src="./stories.js?v=20261011-audio20"></script><script src="./simple-navigation.js?v=20261011-audio20"></script></body>
