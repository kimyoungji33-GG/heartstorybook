      <div id="seat-guides" class="seat-guides" hidden aria-hidden="true">
        <i id="seat-line"></i><i id="seat-point"></i><i id="hip-point" hidden></i>
      </div>
      <button id="chair" class="furniture-target chair-target" type="button" aria-label="정면 의자에 앉기"><span data-room-text="정면 의자">정면 의자</span></button>
      <button id="sofa" class="furniture-target sofa-target" type="button" aria-label="소파에서 가까운 자리에 앉기" data-room-aria="소파에서 가까운 자리에 앉기"><span data-room-text="소파 가까운 자리">소파 가까운 자리</span></button>
      <button id="sofa-left" class="furniture-target sofa-seat sofa-left" type="button" aria-label="소파 왼쪽에 앉기"><span data-room-text="왼쪽 자리">왼쪽 자리</span></button>
      <button id="sofa-right" class="furniture-target sofa-seat sofa-right" type="button" aria-label="소파 오른쪽에 앉기"><span data-room-text="오른쪽 자리">오른쪽 자리</span></button>
      <button class="furniture-target table-target" type="button" aria-label="작은 탁자" data-room-aria="작은 탁자"><span data-room-text="작은 탁자">작은 탁자</span></button>
    </div>
    <dialog id="shelf-dialog" class="shelf-dialog" data-shelf-layout="b" aria-labelledby="shelf-heading">
      <header class="shelf-preview-top">
        <button id="shelf-close" class="shelf-close" type="button" aria-label="새 책방으로 돌아가기" data-room-aria="새 책방으로 돌아가기" autofocus>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5m7-7-7 7 7 7"/></svg>
        </button>
        <h2 id="shelf-heading" class="sr-only" data-room-text="책장 가까이 보기">책장 가까이 보기</h2>
      </header>
      <div class="shelf-scene">
        <div id="shelf-collection"></div>
        <section id="shelf-cover-view" class="shelf-cover-view" hidden>
          <button id="shelf-cover-return" type="button" aria-label="다른 표지 보기" data-room-aria="다른 표지 보기"><img id="shelf-large-cover" alt="" width="512" height="512"></button>
          <h3 id="shelf-cover-title"></h3>
          <p data-room-text="서가에서 읽을 수 있어요">서가에서 읽을 수 있어요</p>
        </section>
      </div>
    </dialog>
    <footer id="controls" class="controls" inert>
      <p id="hint">바닥을 누르면 걸어요. 정면 의자나 소파에 앉아 보세요.</p>
      <button id="stand" type="button" data-room-text="일어나기" hidden>일어나기</button>
      <div id="visitors" class="visitors" role="group" aria-label="아바타 고르기" data-room-aria="아바타 고르기"></div>
    </footer>
    <aside id="motion-report" class="motion-report" aria-label="움직임 상태" hidden>
      <strong id="motion-heading">움직임 2단계</strong>
      <ul></ul>
      <p id="motion-keys" hidden></p>
      <textarea id="motion-copy" rows="6" readonly hidden aria-label="복사할 움직임 값"></textarea>
      <p id="motion-copy-status" role="status"></p>
    </aside>
    <aside id="seat-report" class="seat-report" aria-label="앉는 자리 보기" hidden>
      <strong>등받이·방석 → 아바타 → 팔걸이 앞</strong>
      <p><span class="seat-color">●</span> 방석의 앉는 자리 · <span class="hip-color">●</span> 엉덩이</p>
      <p id="seat-values"></p>
      <p id="seat-keys"></p>
      <textarea id="seat-copy" rows="5" readonly hidden aria-label="복사할 앉는 자리 값"></textarea>
      <p id="seat-copy-status" role="status"></p>
    </aside>
    <p class="motion-note" data-room-text="움직임 줄이기가 켜져 있어요">움직임 줄이기가 켜져 있어요</p>

</html>
