<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>마음동화책방</title><style>
:root{--cream:#fff6e6;--honey:#e8a64a;--brown:#4a3322}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%}body{font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif;color:var(--cream);background:#2b1d14;overflow:hidden}.scene{position:fixed;inset:0;background:linear-gradient(to bottom,rgba(43,29,20,.55),rgba(43,29,20,.2) 40%,rgba(43,29,20,.65)),url("room/images/room_a_chair_03.webp") center/cover no-repeat,linear-gradient(#f3c98b,#c9863f);filter:blur(3px) saturate(1.05);transform:scale(1.06);animation:breathe 18s ease-in-out infinite alternate}.glow{position:fixed;left:50%;top:38%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,200,120,.35),rgba(255,200,120,0) 65%);animation:pulse 7s ease-in-out infinite;pointer-events:none}@keyframes breathe{from{transform:scale(1.06)}to{transform:scale(1.1)}}@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.95}}.wrap{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px;opacity:0;animation:rise 1.4s .3s ease forwards}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}h1{font-size:clamp(34px,7vw,64px);font-weight:700;letter-spacing:.02em;text-shadow:0 2px 14px rgba(40,25,12,.6)}.sub{font-size:clamp(15px,2.4vw,20px);opacity:.92;text-shadow:0 1px 8px rgba(40,25,12,.6)}.choices{margin-top:22px;display:flex;gap:14px;flex-wrap:wrap;justify-content:center}.btn{min-width:190px;min-height:52px;padding:14px 26px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;border:1.5px solid rgba(255,246,230,.7);color:var(--cream);text-decoration:none;font-size:18px;background:rgba(74,51,34,.35);backdrop-filter:blur(4px);transition:background .3s,transform .3s}.btn:disabled{font-family:inherit;opacity:.7;cursor:default}.btn:not(:disabled):hover,.btn:focus-visible{background:rgba(255,246,230,.2);transform:translateY(-2px);outline:none}.btn.primary{background:rgba(232,166,74,.92);color:#3b2614;border-color:transparent;font-weight:700}.btn.primary:hover,.btn.primary:focus-visible{background:#f2b862}.fade{position:fixed;inset:0;background:#2b1d14;opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:5}.fade.on{opacity:1;pointer-events:auto}@media(prefers-reduced-motion:reduce){.scene,.glow{animation:none}.wrap{animation:none;opacity:1}.fade{transition:none}}
</style></head><body><div class="scene"></div><div class="glow"></div><main class="wrap"><h1>마음동화책방</h1><p class="sub">서로의 마음을 천천히 만나는 곳</p><nav class="choices"><a class="btn primary" id="enter" href="room/">거실로 들어가기</a><a class="btn" href="../previous-home.html" target="_blank" rel="noopener">도서관 가기</a><button class="btn" type="button" disabled>체험관 가기 · 준비 중</button></nav></main><div class="fade" id="fade"></div><script>
const enter=document.getElementById('enter');const fade=document.getElementById('fade');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;enter.addEventListener('click',function(e){if(e.button!==0||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;e.preventDefault();const url=enter.href;if(reduce){location.href=url;return}fade.classList.add('on');setTimeout(function(){location.href=url},700)});
</script></body></html>
